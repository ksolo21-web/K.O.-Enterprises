[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-enterprises-company-os"
version = "0.1.0"
description = "Local-first operating system for K.O. Enterprises"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
company-os = "company_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
