name: Public Avon map evidence
'on':
  push:
    branches: [public-avon-map-evidence-20260914]
    paths: ['.github/workflows/public-avon-map-evidence.yml']
permissions:
  contents: read
jobs:
  retrieve:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.actor == 'ksolo21-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read bounded public municipal map features without credentials or private assignments
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,time,urllib.parse,urllib.request,zipfile
          O=pathlib.Path('avon-evidence');O.mkdir()
          B=[-83.178,42.6575,-83.1600,42.6668]
          S={'buildings':'https://atlas.rochesterhills.org/arcgis/rest/services/FacilitiesStructures/Building/FeatureServer/0','addresses':'https://atlas.rochesterhills.org/arcgis/rest/services/Addresses/MasterAddresses_PublicDataset/MapServer/1','roads':'https://atlas.rochesterhills.org/arcgis/rest/services/Roads/Roads_PublicDataset/MapServer/8','county_roads':'https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseTransportationDataMapService/MapServer/0'}
          W=set('OBJECTID ID BuildingType BuildingUse STATUS ChangeDate SOURCE DATE_ENTER STREETNAME ROUTE CartographicName NFC JurisdictionName created_date last_edited_date RevisionDate SITEADDRESS HOUSENUMBER AddressType DateModified'.split())
          def save(p,d):
            b=d if isinstance(d,bytes) else json.dumps(d,indent=2).encode();p.write_bytes(b);return hashlib.sha256(b).hexdigest()
          def req(u,p):
            u=u+'?'+urllib.parse.urlencode(p)
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Read-only public map evidence'}),timeout=40) as r:b=r.read(16000001)
            if len(b)>16000000:raise ValueError('Response exceeds bounded size')
            j=json.loads(b)
            if 'error' in j:raise ValueError(str(j['error']))
            return j,b,u
          def capture(it):
            n,u=it;d=O/n;d.mkdir();rec={'source':u,'bbox':B,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'complete':False,'requests':[]}
            try:
              m,b,_=req(u,{'f':'json'});save(d/'metadata.json',b);oid=m.get('objectIdField') or next(x['name'] for x in m['fields'] if x['type']=='esriFieldTypeOID');fields=[x['name'] for x in m['fields'] if x['name'] in W]
              if oid not in fields:fields.insert(0,oid)
              q={'f':'json','where':'1=1','geometry':','.join(map(str,B)),'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              count,b,_=req(u+'/query',{**q,'returnCountOnly':'true'});save(d/'count.json',b)
              ids,b,_=req(u+'/query',{**q,'returnIdsOnly':'true'});save(d/'ids.json',b);ids=sorted(ids['objectIds'] or [])
              if len(ids)!=count['count'] or len(ids)!=len(set(ids)) or len(ids)>3000:raise ValueError('Count/ID bound mismatch')
              fs=[]
              for k in range(0,len(ids),100):
                chosen=ids[k:k+100];j,b,url=req(u+'/query',{'f':'json','objectIds':','.join(map(str,chosen)),'outFields':','.join(fields),'returnGeometry':'true','outSR':4326})
                if sorted(f['attributes'][oid] for f in j.get('features',[]))!=chosen or j.get('exceededTransferLimit'):raise ValueError('Incomplete page')
                rec['requests'].append({'url':url,'count':len(chosen),'sha256':save(d/f'page-{k//100:03}.json',b)});fs+=j['features']
              save(d/'features.json',{'source':u,'spatialReference':{'wkid':4326},'features':fs});rec.update(complete=True,expected_count=len(ids),returned_count=len(fs))
            except Exception as e:rec['error']=str(e)
            save(d/'receipt.json',rec);print(n,rec['complete'],rec.get('returned_count'),rec.get('error'),flush=True);return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:receipts=list(pool.map(capture,S.items()))
          q='[out:json][timeout:50];(way[highway](42.6575,-83.172,42.6668,-83.160);way[building](42.6575,-83.172,42.6668,-83.160););out count;out meta geom;'
          rec={'source':'https://overpass-api.de/api/interpreter','query':q,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'complete':False}
          try:
            j,b,u=req(rec['source'],{'data':q});save(O/'osm.json',b);cs=[x for x in j['elements'] if x['type']=='count'];els=[x for x in j['elements'] if x['type']!='count']
            if j.get('remark') or len(cs)!=1 or int(cs[0]['tags']['total'])!=len(els):raise ValueError('OSM inventory incomplete')
            rec.update(complete=True,returned_count=len(els),sha256=hashlib.sha256(b).hexdigest())
          except Exception as e:rec['error']=str(e)
          receipts.append(rec);save(O/'receipts.json',receipts)
          with zipfile.ZipFile('avon-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in O.rglob('*'):
              if p.is_file():z.write(p,str(p))
          print('All sources complete:',all(r['complete'] for r in receipts),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-avon-map-evidence
          path: avon-evidence.zip
          retention-days: 1
          if-no-files-found: error
