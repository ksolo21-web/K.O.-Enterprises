# PROPOSED MANUAL-ONLY workflow, development branch. NOT authorized to run while
# PAUSE_AUTONOMY exists. Never processes customer media or production credentials.
name: Home Inspection - Synthetic Local Vision Trial (Manual Only)

on:
  workflow_dispatch:
    inputs:
      authorize_synthetic_only:
        description: 'Type SYNTHETIC_ONLY to confirm no customer media or release activity'
        required: true
        type: string

permissions:
  contents: read

jobs:
  local-vision-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/home-inspection-development' &&
      github.repository == 'ksolo21-web/K.O.-Enterprises' &&
      inputs.authorize_synthetic_only == 'SYNTHETIC_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ventures/home-inspection
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODELS: ${{ runner.temp }}/home-inspection-models
    steps:
      - name: Check out source (no persisted GitHub credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed on company autonomy pause and unapproved content
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e ../../PAUSE_AUTONOMY ]]; then
            echo 'BLOCKED: PAUSE_AUTONOMY is active; owner governance required before external compute.' >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != 'refs/heads/home-inspection-development' ]]; then
            echo 'BLOCKED: unexpected branch' >&2
            exit 1
          fi
          if [[ -e examples/customer_data || -e private_case || -e customer_data ]]; then
            echo 'BLOCKED: unexpected customer-media path' >&2
            exit 1
          fi
          echo 'Governance gate passed; synthetic inputs only.'
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python requirements and verify FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          command -v ffmpeg || { echo 'FFmpeg missing from runner image' >&2; exit 1; }
          python -m scripts.generate_public_fixtures
          python -m unittest discover -s tests -q
      - name: Verify disk budget and install pinned Ollama binary from verified archive
        shell: bash
        run: |
          set -euo pipefail
          # Official Linux binary archive, fixed tag and published GitHub asset checksum.
          # No mutable installer script or arbitrary shell code from the network.
          command -v zstd >/dev/null || { echo 'BLOCKED: runner missing zstd' >&2; exit 1; }
          free_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
          if (( free_kib < 9 * 1024 * 1024 )); then
            echo 'BLOCKED: less than 9 GiB disk available for binary and models' >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          install_dir="$RUNNER_TEMP/ollama-pinned"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst \
            --output "$archive"
          python -m scripts.verify_pinned_ollama "$archive"
          tar --zstd -xf "$archive" -C "$install_dir"
          rm -- "$archive" # recover SSD space for the two models
          [[ -x "$install_dir/bin/ollama" ]] || { echo 'BLOCKED: verified archive lacks executable' >&2; exit 1; }
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
          export PATH="$install_dir/bin:$PATH"
          ollama --version
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen2.5vl:3b
          ollama pull granite3.2-vision:2b
      - name: Run actual image-conditioned specialist and Q02 gate
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_vision_acceptance \
            --writer-model qwen2.5vl:3b \
            --review-model granite3.2-vision:2b \
            --out-dir local-results/github-actions-synthetic-live
      - name: Publish non-customer acceptance artifacts even on blocked model outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-inspection-synthetic-vision-evidence
          path: ventures/home-inspection/local-results/github-actions-synthetic-live/
          if-no-files-found: ignore
          retention-days: 3
