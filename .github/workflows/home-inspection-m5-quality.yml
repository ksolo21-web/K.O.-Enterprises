# M5 GitHub engineering milestone: offline reproducibility and versioned fixtures.
# Synthetic-only: no real evidence, models, secrets, external APIs or customer release.
name: Home Inspection M5 - Versioned Synthetic and PDF Reproducibility
on:
  push:
    branches: [home-inspection-development]
    paths:
      - 'ventures/home-inspection/**'
      - '.github/workflows/home-inspection-m5-quality.yml'
  pull_request:
    branches: [home-inspection-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ventures/home-inspection
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPANY_OS_PAUSED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install reproducible offline report dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject unregistered changes to inspection safety modules and autonomy pause
        run: python -m scripts.m5_safety_change_gate
      - name: Validate versioned public synthetic examples and two complete PDF renders
        run: python -m scripts.m5_release_quality_gate
      - name: Enforce nine synthetic serious-defect quality contract scenarios
        run: python -m scripts.m5_benchmark_contract_gate
      - name: Build, verify and restore bounded synthetic-only evidence archive
        run: |
          python -m scripts.m5_synthetic_recovery --create "$RUNNER_TEMP/m5-synthetic-inspection-evidence.zip"
          python -m scripts.m5_synthetic_recovery --verify "$RUNNER_TEMP/m5-synthetic-inspection-evidence.zip"
          python -m scripts.m5_synthetic_recovery --restore "$RUNNER_TEMP/m5-synthetic-inspection-evidence.zip" "$RUNNER_TEMP/m5-restored-evidence"
      - name: Bind synthetic evidence receipt to CI checkout and verify it independently
        run: |
          python -m scripts.m5_engineering_receipt --create "$RUNNER_TEMP/m5-engineering-receipt.json" --archive "$RUNNER_TEMP/m5-synthetic-inspection-evidence.zip" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID"
          python -m scripts.m5_engineering_receipt --verify "$RUNNER_TEMP/m5-engineering-receipt.json" --archive "$RUNNER_TEMP/m5-synthetic-inspection-evidence.zip" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID"
      - name: Run adversarial synthetic recovery, fixture, governance and pilot-design tests
        run: |
          python -m unittest discover -s tests -p 'test_m5_engineering_receipt.py' -v
          python -m unittest discover -s tests -p 'test_m5_benchmark_contract_gate.py' -v
          python -m unittest discover -s tests -p 'test_m5_synthetic_recovery.py' -v
          python -m unittest discover -s tests -p 'test_m5_safety_change_gate.py' -v
          python -m unittest discover -s tests -p 'test_m5_release_quality_gate.py' -v
          python -m unittest discover -s tests -p 'test_m5_pilot_readiness.py' -v
      - name: Upload only generated synthetic inspection recovery evidence
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-synthetic-inspection-recovery
          path: |
            ${{ runner.temp }}/m5-synthetic-inspection-evidence.zip
            ${{ runner.temp }}/m5-engineering-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify tracked source integrity and keep customer release blocked
        run: |
          git diff --exit-code -- .
          test ! -d customer_data
