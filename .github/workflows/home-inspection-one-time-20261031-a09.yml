# One-time trial authorized by the owner; no cron, no PR triggers, no deployment.
name: Home Inspection - Three-Role Synthetic CPU Trial (A09)
on:
  push:
    branches: [home-inspection-development]
    paths:
      - ventures/home-inspection/docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-31_A09.md
permissions:
  contents: read
concurrency:
  group: home-inspection-approved-synthetic-20261031-a09
  cancel-in-progress: false
jobs:
  one-time-vision-proof:
    if: >-
      github.run_attempt == '1' &&
      github.event_name == 'push' &&
      github.repository == 'ksolo21-web/K.O.-Enterprises' &&
      github.ref == 'refs/heads/home-inspection-development' &&
      github.event.head_commit.message == 'trial(home-inspection): OWNER_APPROVED_SYNTHETIC_CPU_RUN_20261031_A09'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ventures/home-inspection
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_KEEP_ALIVE: '0'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OLLAMA_DEBUG: '0'
      OLLAMA_CONTEXT_LENGTH: '16384'
      A09_REPOSITORY_VISIBILITY: '${{ github.event.repository.visibility }}'
    steps:
      - name: Checkout exact authorized development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact one-shot authorization and source parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-a09
          python -m scripts.a09_scope --out local-results/github-actions-a09/scope.json
          date +%s > local-results/github-actions-a09/job_start_epoch
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg and zstd before any media processing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for binary in ffmpeg zstd; do
            if ! command -v "$binary" >/dev/null 2>&1; then missing+=("$binary"); fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          command -v ffmpeg
          command -v zstd
          ffmpeg -version
          zstd --version
          tar --help | grep -q -- --zstd
      - name: Install dependencies and generate synthetic fixtures (non-inference)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          command -v ffmpeg
          command -v zstd
          python -m scripts.generate_public_fixtures
      - name: Validate corrected source before model downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-a09
          python -m unittest discover -s tests -q 2>&1 | tee local-results/github-actions-a09/regression.log
      - name: Download and verify pinned Ollama binary
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          free_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
          if (( free_kib < 18 * 1024 * 1024 )); then
            echo 'BLOCKED: less than 18 GiB free disk for three models and verified binary' >&2
            exit 1
          fi
          python -m scripts.a09_scope --resources --out local-results/github-actions-a09/resource_budget.json
          free -b > local-results/github-actions-a09/resources_before_models.txt
          df -B1 "$RUNNER_TEMP" > local-results/github-actions-a09/disk_before_models.txt
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          install_dir="$RUNNER_TEMP/ollama-pinned"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst \
            --output "$archive"
          python -m scripts.verify_pinned_ollama "$archive"
          tar --zstd -xf "$archive" -C "$install_dir"
          rm -- "$archive"
          test -x "$install_dir/bin/ollama"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          export PATH="$install_dir/bin:$PATH"
          ollama --version
          mkdir -p "$RUNNER_TEMP/home-inspection-models"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/home-inspection-models" >> "$GITHUB_ENV"
      - name: Start local CPU vision runtime and obtain public weights
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          echo "A09_OLLAMA_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          python -m scripts.a09_resources --out local-results/github-actions-a09/process_samples.json &
          echo "A09_SAMPLER_PID=$!" >> "$GITHUB_ENV"
          ollama pull qwen2.5vl:3b
          ollama pull granite3.2-vision:2b
          ollama pull qwen2.5:7b
      - name: Verify all three pinned weight digests without inference
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.a09_scope --models --out local-results/github-actions-a09/model_identities.json
      - name: One synthetic writer tools Q02 Q03 and held-report trial
        shell: bash
        run: |
          set -euo pipefail
          start_epoch=$(cat local-results/github-actions-a09/job_start_epoch)
          now_epoch=$(date +%s)
          remaining=$(( 45 * 60 - (now_epoch - start_epoch) - 180 ))
          if (( remaining < 180 )); then
            echo 'BLOCKED: insufficient job budget remains; no inference started' >&2
            exit 1
          fi
          if (( remaining > 1800 )); then remaining=1800; fi
          echo "$remaining" > local-results/github-actions-a09/trial_outer_deadline_seconds
          timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python -m scripts.run_m2_reconciliation_trial \
            --writer-model qwen2.5vl:3b \
            --review-model granite3.2-vision:2b \
            --reasoning-model qwen2.5:7b \
            --out-dir local-results/github-actions-a09/trial --allow-local-inference
      - name: Preserve bounded normal server diagnostics regardless of result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-a09
          python -m scripts.a09_resources --stop --out local-results/github-actions-a09/cleanup.json || true
          if test -f "$RUNNER_TEMP/ollama.log"; then
            tail -c 131072 "$RUNNER_TEMP/ollama.log" > local-results/github-actions-a09/ollama.log
          fi
          python - <<'PYCODE' || true
          import json,pathlib
          from scripts.a09_resources import sample
          pathlib.Path('local-results/github-actions-a09/process_final.json').write_text(json.dumps(sample(),indent=2)+'\n')
          PYCODE
          free -b > local-results/github-actions-a09/memory.txt
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('local-results/github-actions-a09')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'manifest.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - name: Preserve only synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-time-home-inspection-reconciliation-a09
          path: ventures/home-inspection/local-results/github-actions-a09/
          if-no-files-found: ignore
          retention-days: 3
