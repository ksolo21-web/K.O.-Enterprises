name: Territory v4 - four-edge local critic calibration
on:
  push:
    branches: [territory-card-production]
    paths:
      - 'territory/production/runtime/calibrate_v4.py'
      - '.github/workflows/territory-v4-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: territory-v4-calibration
  cancel-in-progress: true
jobs:
  local-critic:
    if: ${{ github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.ref == 'refs/heads/territory-card-production' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      COMPANY_OS_PAUSED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install fixed synthetic-test dependencies without caches
        run: python -m pip install Pillow==12.3.0 jsonschema==4.26.0
      - name: Fetch hash-pinned local runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/ollama.tar.zst" https://github.com/ollama/ollama/releases/download/v0.33.3/ollama-linux-amd64.tar.zst
          echo "c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tar.zst"
      - name: Inspect all retained cases and four new holdout images
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && break || sleep 1
          done
          timeout 480 ollama pull qwen3-vl:8b-instruct > "$RUNNER_TEMP/model-pull.log" 2>&1 || { tail -c 2000 "$RUNNER_TEMP/model-pull.log"; exit 1; }
          timeout 2400 python territory/production/runtime/calibrate_v4.py --out "$RUNNER_TEMP/calibration-v4.json"
      - name: Preserve public synthetic evidence on the territory branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/calibration-v4.json" || { echo 'No inference receipt was produced.' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          gh api --method PUT "repos/ksolo21-web/K.O.-Enterprises/contents/territory/production/evidence/calibration-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" -f message='Retain actual v4 synthetic critic calibration evidence' -f branch='territory-card-production' -f content="$(base64 -w0 "$RUNNER_TEMP/calibration-v4.json")" > "$RUNNER_TEMP/publication.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/calibration-v4.json")); print(str(p["passed"])+"/"+str(p["required"])+" synthetic cases passed. This is not real-card qualification or approval.")' >> "$GITHUB_STEP_SUMMARY"
