# One-time trial authorized by the owner; no cron, no PR triggers, no deployment.
name: Home Inspection - Isolated Specialist CPU Diagnostic (A08)
on:
  push:
    branches: [home-inspection-development]
    paths:
      - ventures/home-inspection/docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-31_A08.md
permissions:
  contents: read
concurrency:
  group: home-inspection-approved-synthetic-20261031-a08
  cancel-in-progress: false
jobs:
  one-time-vision-proof:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ksolo21-web/K.O.-Enterprises' &&
      github.ref == 'refs/heads/home-inspection-development' &&
      github.event.head_commit.message == 'trial(home-inspection): OWNER_APPROVED_SYNTHETIC_CPU_RUN_20261031_A08'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ventures/home-inspection
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_KEEP_ALIVE: '0'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OLLAMA_DEBUG: '0'
    steps:
      - name: Checkout exact authorized development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify narrow owner approval; keep company autonomy paused
        shell: bash
        run: |
          set -euo pipefail
          test -f ../../PAUSE_AUTONOMY
          test -f docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-31_A08.md
          grep -Fxq 'Authorization-ID: OWNER_APPROVED_SYNTHETIC_CPU_RUN_20261031_A08' docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-31_A08.md
          grep -Fxq 'Authorization-Scope: one synthetic-only GitHub-hosted CPU vision trial, no customers, no secrets, no deployment' docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-31_A08.md
          test "$GITHUB_REF" = 'refs/heads/home-inspection-development'
          test "$GITHUB_REPOSITORY" = 'ksolo21-web/K.O.-Enterprises'
          ! test -d private_case && ! test -d customer_data && ! test -d client_data
          echo 'Explicit one-time synthetic exception verified. All other external actions stay paused.'
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg and zstd before any media processing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for binary in ffmpeg zstd; do
            if ! command -v "$binary" >/dev/null 2>&1; then missing+=("$binary"); fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          command -v ffmpeg
          command -v zstd
          ffmpeg -version
          zstd --version
          tar --help | grep -q -- --zstd
      - name: Install dependencies and generate synthetic fixtures (non-inference)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          command -v ffmpeg
          command -v zstd
          python -m scripts.generate_public_fixtures
      - name: Validate corrected source before model downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-a08
          python -m unittest discover -s tests -q 2>&1 | tee local-results/github-actions-a08/regression.log
      - name: Download and verify pinned Ollama binary
        shell: bash
        run: |
          set -euo pipefail
          free_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
          if (( free_kib < 9 * 1024 * 1024 )); then
            echo 'BLOCKED: less than 9 GiB free disk' >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          install_dir="$RUNNER_TEMP/ollama-pinned"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst \
            --output "$archive"
          python -m scripts.verify_pinned_ollama "$archive"
          tar --zstd -xf "$archive" -C "$install_dir"
          rm -- "$archive"
          test -x "$install_dir/bin/ollama"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          export PATH="$install_dir/bin:$PATH"
          ollama --version
          mkdir -p "$RUNNER_TEMP/home-inspection-models"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/home-inspection-models" >> "$GITHUB_ENV"
      - name: Start local CPU vision runtime and obtain public weights
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5vl:3b
      - name: Verify only the pinned writer identity (no inference)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          from scripts.isolate_specialist_request import verify_writer
          result=verify_writer()
          pathlib.Path('local-results/github-actions-a08/writer_identity.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: One exact synthetic specialist request; hard 600-second deadline
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 630s \
            python -m scripts.isolate_specialist_request \
            --out-dir local-results/github-actions-a08/request \
            --deadline-seconds 600
      - name: Preserve bounded normal server diagnostics regardless of result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-a08
          if test -f "$RUNNER_TEMP/ollama.log"; then
            tail -c 131072 "$RUNNER_TEMP/ollama.log" > local-results/github-actions-a08/ollama.log
          fi
          (ps -C ollama -o pid,pcpu,pmem,rss,etime,comm || true) > local-results/github-actions-a08/process.txt
          free -b > local-results/github-actions-a08/memory.txt
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('local-results/github-actions-a08')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'manifest.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - name: Preserve only synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-time-home-inspection-isolated-specialist-a08
          path: ventures/home-inspection/local-results/github-actions-a08/
          if-no-files-found: ignore
          retention-days: 3
