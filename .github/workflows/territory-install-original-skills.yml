name: Territory original skills installation
'on':
  push:
    branches: [territory-card-production]
    paths:
      - 'territory/source-transfer/part-*.txt'
      - 'territory/source-transfer/assemble_originals.py'
      - '.github/workflows/territory-install-original-skills.yml'
permissions:
  contents: read
concurrency:
  group: territory-original-skills-installation
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.actor == 'ksolo21-web' && github.ref == 'refs/heads/territory-card-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rebuild only the exact original archive from all 39 source segments
        run: python3 territory/source-transfer/assemble_originals.py
      - name: Install and verify all immutable original skill sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root=Path('territory/production').resolve()
          sys.path.insert(0,str(root))
          import engine
          result=engine.install_skills(root/'Territory-Skills-Source-Capsule.zip')
          if result.get('verified_files')!=138 or result.get('source_integrity') is not True:
              raise SystemExit('Original source installation verification failed.')
          print(result)
          PY
      - name: Install test dependency without cache or paid services
        run: |
          python3 -m venv "$RUNNER_TEMP/territory-source-test-env"
          "$RUNNER_TEMP/territory-source-test-env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir PyMuPDF==1.26.7
      - name: Test and retain exact source-only installation evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/territory-source-test-env/bin/python" - <<'PY'
          from pathlib import Path
          import io,json,os,sys,unittest
          root=Path('territory/production').resolve()
          sys.path.insert(0,str(root))
          import engine
          before=engine.verify_skills()
          suite=unittest.defaultTestLoader.loadTestsFromName('test_engine')
          log=io.StringIO()
          result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          print(log.getvalue())
          if not result.wasSuccessful() or result.skipped or result.testsRun!=27:
              raise SystemExit('Existing orchestration tests failed, were skipped, or changed count.')
          after=engine.verify_skills()
          receipt={'kind':'verified_original_skill_installation','original_files_verified':138,
                   'transfer_segments_verified':39,'source_commit':os.environ['GITHUB_SHA'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'tests_run':result.testsRun,
                   'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),
                   'source_integrity_before':before,'source_integrity_after':after,
                   'card_release_authorized':False,
                   'remaining':['Deploy and verify candidate extensions',
                                'Independent critic qualification on real accepted and rejected cards',
                                'Encrypted job end-to-end test',
                                'Complete review, authorized repair, retest and release integration']}
          (root/'SOURCE-INSTALLATION-RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Original skills installed and tested\n39/39 transfer segments and 138/138 original files verified.\n\n27/27 orchestration tests passed.\n\nSource installation is not approval of unattended territory-card production.\n')
          PY
      - name: Preserve only verified source files and installation receipt
        env:
          GH_INSTALL_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,os,subprocess
          prefix='territory/production/'
          allowed=[prefix+'Territory-Skills-Source-Capsule.zip',prefix+'vendor',prefix+'skills-manifest.json',prefix+'SOURCE-INSTALLATION-RECEIPT.json']
          def run(args,**kw):
              return subprocess.run(args,check=True,text=True,capture_output=True,**kw)
          run(['git','add','-f','--',*allowed])
          staged=list(filter(None,run(['git','diff','--cached','--name-only','-z']).stdout.split('\0')))
          if any(name not in allowed and not name.startswith(prefix+'vendor/') for name in staged):
              raise SystemExit('Unexpected staged path; no write permitted.')
          if not staged:
              raise SystemExit(0)
          run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Install all 138 verified original territory skill files [skip ci]'])
          token=os.environ.pop('GH_INSTALL_TOKEN')
          env=os.environ.copy()
          env.update({'GIT_TERMINAL_PROMPT':'0','GIT_CONFIG_COUNT':'1',
                      'GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader',
                      'GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()})
          run(['git','push','origin','HEAD:refs/heads/territory-card-production'],env=env)
          local=run(['git','rev-parse','HEAD']).stdout.strip()
          remote=run(['git','ls-remote','origin','refs/heads/territory-card-production'],env=env).stdout.split()[0]
          if local!=remote:
              raise SystemExit('Remote branch changed; recheck before claiming deployment.')
          print('Verified original source installation commit: '+local)
          PY
