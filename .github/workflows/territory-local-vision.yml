name: Territory local vision - synthetic smoke only
on:
  push:
    branches: [territory-card-production]
    paths: ['territory/production/vision_smoke.py', '.github/workflows/territory-local-vision.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: territory-vision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-vision:
    if: ${{ github.event.repository.private == false && github.repository == 'ksolo21-web/K.O.-Enterprises' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install only synthetic-smoke dependencies
        run: python -m pip install Pillow==12.3.0 jsonschema==4.26.0
      - name: Fetch and verify the fixed local runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 -o "$RUNNER_TEMP/ollama.tgz" https://github.com/ollama/ollama/releases/download/v0.11.10/ollama-linux-amd64.tgz
          echo "da2be71e972752e3099ef1d1226050d2b3d1ce79a4fec3bdb6edc70a7601e060  $RUNNER_TEMP/ollama.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tgz"
      - name: Run bounded real local inference without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && break || sleep 1
          done
          timeout 300 ollama pull qwen2.5vl:3b
          timeout 520 python territory/production/vision_smoke.py
