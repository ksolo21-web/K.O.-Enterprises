name: Streamwood public clubhouse location verification
'on':
  push:
    branches: [territory-255-260-geography-20260911]
    paths: ['.github/workflows/public-streamwood-clubhouse-verification-20260920.yml']
permissions:
  contents: read
jobs:
  public_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve bounded public location evidence
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,datetime,hashlib,zipfile
          out=pathlib.Path('public-clubhouse');out.mkdir()
          base='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates'
          queries={
            'address':base+'?'+urllib.parse.urlencode({'f':'json','SingleLine':'1900 Streamwood Dr, Rochester Hills, MI 48309','outFields':'Match_addr,Addr_type,DisplayX,DisplayY,X,Y,PlaceName,Type','maxLocations':3}),
            'poi':base+'?'+urllib.parse.urlencode({'f':'json','SingleLine':'Streamwood Estates Condominiums, Rochester Hills, Michigan','outFields':'Match_addr,Addr_type,DisplayX,DisplayY,X,Y,PlaceName,Type','maxLocations':3}),
            'osm':'https://overpass-api.de/api/interpreter?'+urllib.parse.urlencode({'data':'[out:json][timeout:25];(way(around:100,42.653245,-83.171410)[building];nwr(around:100,42.653245,-83.171410)[amenity];);out body geom;'}),
            'official_rental':'https://highlandergroup.net/wp-content/uploads/2024/01/Streamwood-Estates-Clubhouse-Rental-Information-December-2023.pdf'
          }
          receipts=[]
          for key,url in queries.items():
            rec={'id':key,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'complete':False}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Public map location verification, bounded read-only retrieval'})
              with urllib.request.urlopen(req,timeout=35) as r:b=r.read(4000001);ctype=r.headers.get('Content-Type')
              assert len(b)<=4000000,'size cap exceeded'
              ext='pdf' if b.startswith(b'%PDF') else 'json'
              if ext=='json':json.loads(b)
              (out/(key+'.'+ext)).write_bytes(b)
              rec.update(complete=True,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),content_type=ctype)
            except Exception as e:rec['error']=str(e)
            receipts.append(rec)
          (out/'receipts.json').write_text(json.dumps(receipts,indent=2))
          print(json.dumps(receipts,indent=2))
          with zipfile.ZipFile('public-clubhouse.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in out.iterdir():z.write(p,p.name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streamwood-public-clubhouse-location-20260920
          path: public-clubhouse.zip
          retention-days: 2
          if-no-files-found: error
