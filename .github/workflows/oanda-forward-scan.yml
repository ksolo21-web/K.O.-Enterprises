name: OANDA forward Practice scan (read only)

on:
  push:
    branches:
      - feature/oanda-forward-practice-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oanda-forward-practice-scan
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run forward-lab safety tests
        run: python -m unittest tests.test_oanda_forward_lab -v

      - name: Resolve the authorized Practice account
        env:
          OANDA_DEMO_TOKEN: ${{ secrets.OANDA_demo_API_token }}
          OANDA_DEMO_ACCOUNT_ID: ${{ secrets.OANDA_demo_account_ID }}
        run: >-
          python -m experiments.oanda_demo.token_probe
          --output state/oanda-forward-account-id.txt

      - name: Scan current completed candles and executable price
        env:
          OANDA_DEMO_TOKEN: ${{ secrets.OANDA_demo_API_token }}
        run: |
          OANDA_DEMO_ACCOUNT_ID="$(tr -d '\r\n' < state/oanda-forward-account-id.txt)"
          test -n "$OANDA_DEMO_ACCOUNT_ID"
          export OANDA_DEMO_ACCOUNT_ID
          python -m experiments.oanda_demo.forward_lab scan \
            --output state/oanda-forward-plan.json

      - name: Upload sanitized current plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oanda-forward-plan-${{ github.run_id }}
          path: state/oanda-forward-plan.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Remove all broker-derived runner state
        if: always()
        run: >-
          rm -f state/oanda-forward-account-id.txt
          state/oanda-forward-plan.json
