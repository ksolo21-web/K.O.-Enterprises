name: Territory private visual critic - local model only
'on':
  push:
    branches: [territory-card-production]
    paths:
      - 'territory/transport/visual-requests/**'
      - 'territory/production/visual_review.py'
      - 'territory/production/visual_worker.py'
      - 'territory/production/test_visual_review.py'
      - 'territory/production/test_visual_card_review.py'
      - 'territory/production/transport.py'
      - '.github/workflows/territory-private-visual-review.yml'
permissions:
  contents: read
concurrency:
  group: territory-private-visual-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.actor == 'ksolo21-web' && github.ref == 'refs/heads/territory-card-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      session: ${{ steps.select.outputs.session }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install fixed test dependencies without caches
        run: |
          python3 -m venv "$RUNNER_TEMP/testenv"
          "$RUNNER_TEMP/testenv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r territory/production/requirements.txt
      - name: Recheck original sources and visual-controller tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/testenv/bin/python" - <<'PY'
          import json,os,sys,unittest
          from pathlib import Path
          root=Path('territory/production').resolve();sys.path.insert(0,str(root))
          import engine,audit_kit
          before=engine.verify_skills()
          if audit_kit.main()!=0:raise SystemExit('Existing audit failed.')
          base=json.loads((root/'evidence/continuation-kit-audit.json').read_text())
          if base['tests_run']!=137 or not base['software_tests_passed']:raise SystemExit('Existing suite failed or changed.')
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_visual_review','test_visual_card_review'])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun!=30 or result.skipped or not result.wasSuccessful():raise SystemExit('Visual controller tests failed or changed.')
          after=engine.verify_skills()
          receipt={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],
                   'original_files_verified':138,'existing_tests_passed':137,'visual_controller_tests_passed':30,
                   'total_tests_passed':167,'failures':0,'errors':0,'skipped':0,
                   'visual_model_qualified':False,'real_cards_released':0,'release_ready':False}
          Path(os.environ['RUNNER_TEMP'],'controller-tests.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Preserve nonprivate test receipt on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/ksolo21-web/K.O.-Enterprises/contents/territory/production/evidence/visual-controller-${GITHUB_RUN_ID}.json" -f message='Retain verified visual-controller software tests [skip ci]' -f branch='territory-card-production' -f content="$(base64 -w0 "$RUNNER_TEMP/controller-tests.json")" > "$RUNNER_TEMP/test-receipt-upload.json"
      - id: select
        name: Select only one changed owner-created opaque review request
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          sha=os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}',sha):raise SystemExit('Invalid commit identity.')
          result=subprocess.run(['git','diff','--name-only','--diff-filter=AM','-z',sha+'^',sha,'--'],check=True,capture_output=True)
          names=set(result.stdout.decode().split('\0'))
          sessions=[n.rsplit('/',1)[-1] for n in names if re.fullmatch(r'territory/transport/visual-requests/[0-9a-f]{32}',n)]
          if len(sessions)>1:raise SystemExit('One private review session per run is permitted.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('session='+(sessions[0] if sessions else '')+'\n')
          print('Selected opaque review requests:',len(sessions))
          PY
  review:
    needs: verify
    if: needs.verify.outputs.session != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned local execution dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/reviewenv"
          "$RUNNER_TEMP/reviewenv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r territory/production/requirements.txt
      - name: Install the exact previously tested local runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/ollama.tar.zst" https://github.com/ollama/ollama/releases/download/v0.33.3/ollama-linux-amd64.tar.zst
          echo "c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tar.zst"
      - name: Run encrypted real-image calibration or card review with a separate local model
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SESSION: ${{ needs.verify.outputs.session }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          ollama serve > "$RUNNER_TEMP/ollama-private.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break || sleep 1; done
          timeout 480 ollama pull qwen3-vl:8b-instruct > "$RUNNER_TEMP/model-pull.log" 2>&1
          "$RUNNER_TEMP/reviewenv/bin/python" territory/production/visual_worker.py "$REVIEW_SESSION"
      - name: Do not upload private images, reports, model logs or caches
        if: always()
        run: echo 'Only encrypted results and opaque status are stored. Card release is not authorized by this workflow.' >> "$GITHUB_STEP_SUMMARY"
