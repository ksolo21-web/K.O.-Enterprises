name: Public Timberlea map evidence
'on':
  push:
    branches: [public-timberlea-map-evidence-20260913]
    paths: ['.github/workflows/public-timberlea-map-evidence.yml']
permissions:
  contents: read
jobs:
  retrieve:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.actor == 'ksolo21-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read bounded public features without private card data or credentials
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, time, urllib.parse, urllib.request, urllib.error, zipfile
          OUT=pathlib.Path('timberlea-evidence'); OUT.mkdir(exist_ok=True)
          BBOX=[-83.1580,42.6725,-83.1525,42.6835]
          SOURCES={
          'buildings': 'https://atlas.rochesterhills.org/arcgis/rest/services/FacilitiesStructures/Building/FeatureServer/0',
          'addresses': 'https://atlas.rochesterhills.org/arcgis/rest/services/Addresses/MasterAddresses_PublicDataset/MapServer/1',
          'roads': 'https://atlas.rochesterhills.org/arcgis/rest/services/Roads/Roads_PublicDataset/MapServer/8',
          'county_roads': 'https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseTransportationDataMapService/MapServer/0'}
          WANTED=set('OBJECTID ID PARCELID ParcelID PELNUMBER KEYPIN SITEADDRESS HOUSENUMBER HouseNumberNumb BUILDING AddressType DateModified BuildingType BuildingUse STATUS ChangeDate SOURCE DATE_ENTER STREETNAME ROUTE StreetName StreetType DirectionalPrefix DirectionalSuffix CartographicName NFC JurisdictionName created_date last_edited_date RevisionDate'.split())
          def save(path,data):
            raw=data if isinstance(data,bytes) else json.dumps(data,indent=2).encode();path.write_bytes(raw);return hashlib.sha256(raw).hexdigest()
          def req(url,params,method='GET'):
            encoded=urllib.parse.urlencode(params);full=url+'?'+encoded
            request=urllib.request.Request(full if method=='GET' else url,data=encoded.encode() if method=='POST' else None,headers={'User-Agent':'Read-only public map quality check','Content-Type':'application/x-www-form-urlencoded'})
            with urllib.request.urlopen(request,timeout=35) as response:
              raw=response.read(16000001)
              if len(raw)>16000000:raise ValueError('Bound exceeded')
              data=json.loads(raw)
            if 'error' in data:raise ValueError(str(data['error']))
            return data,raw,full
          def capture(name,url):
            d=OUT/name;d.mkdir();r={'source':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'bbox':BBOX,'complete':False,'requests':[]}
            try:
              meta,raw,full=req(url,{'f':'json'});save(d/'metadata.json',raw)
              oid=meta.get('objectIdField') or next(f['name'] for f in meta['fields'] if f['type']=='esriFieldTypeOID')
              fields=[f['name'] for f in meta['fields'] if f['name'] in WANTED]
              if oid not in fields:fields.insert(0,oid)
              query={'f':'json','where':'1=1','geometry':','.join(map(str,BBOX)),'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              count,raw,full=req(url+'/query',{**query,'returnCountOnly':'true'});save(d/'count.json',raw)
              ids,raw,full=req(url+'/query',{**query,'returnIdsOnly':'true'});save(d/'ids.json',raw)
              expected=sorted(ids['objectIds'] or [])
              if len(expected)!=count['count'] or len(expected)!=len(set(expected)):raise ValueError('IDs/count disagree')
              if len(expected)>2000:raise ValueError('More than 2000 features in narrow evidence area')
              features=[]
              for offset in range(0,len(expected),25):
                selected=expected[offset:offset+25];params={'f':'json','objectIds':','.join(map(str,selected)),'outFields':','.join(fields),'returnGeometry':'true','outSR':4326}
                method='GET'
                try:data,raw,full=req(url+'/query',params)
                except urllib.error.HTTPError as e:
                  if e.code not in (400,404,414):raise
                  method='POST';data,raw,full=req(url+'/query',params,method)
                actual=sorted(f['attributes'][oid] for f in data.get('features',[]))
                if actual!=selected or data.get('exceededTransferLimit'):raise ValueError('Page incomplete')
                digest=save(d/f'page-{offset//25:03}.json',raw)
                r['requests'].append({'url':full,'method':method,'sha256':digest,'count':len(actual),'ids':actual})
                features.extend(data['features']);time.sleep(.15)
              save(d/'features.json',{'source':url,'spatialReference':{'wkid':4326},'features':features})
              r.update(complete=True,expected_count=len(expected),returned_count=len(features),fields=fields)
            except Exception as e:r['error']=type(e).__name__+': '+str(e)
            save(d/'receipt.json',r);print(name,r['complete'],r.get('returned_count'),r.get('error'),flush=True);return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
            receipts=list(pool.map(lambda item:capture(*item),SOURCES.items()))
          q='[out:json][timeout:45];(way[highway](42.6725,-83.1580,42.6767,-83.1525);way[building](42.6725,-83.1580,42.6767,-83.1525););out count;out meta geom;'
          r={'source':'https://overpass-api.de/api/interpreter','query':q,'complete':False,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            data,raw,full=req(r['source'],{'data':q});save(OUT/'osm.json',raw)
            if data.get('remark'):raise ValueError(data['remark'])
            counts=[x for x in data['elements'] if x['type']=='count'];els=[x for x in data['elements'] if x['type']!='count']
            if len(counts)!=1 or int(counts[0]['tags']['total'])!=len(els):raise ValueError('OSM count mismatch')
            r.update(complete=True,returned_count=len(els),sha256=hashlib.sha256(raw).hexdigest())
          except Exception as e:r['error']=type(e).__name__+': '+str(e)
          receipts.append(r);save(OUT/'receipts.json',receipts)
          with zipfile.ZipFile('timberlea-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(OUT.rglob('*')):
              if p.is_file():z.write(p,p.as_posix())
          print('Evidence bytes',pathlib.Path('timberlea-evidence.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-timberlea-map-evidence
          path: timberlea-evidence.zip
          retention-days: 1
          if-no-files-found: error
