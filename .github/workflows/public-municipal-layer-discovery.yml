name: Public municipal layer discovery
'on':
  push:
    branches: [public-rochester-north-evidence-20260915]
    paths: ['.github/workflows/public-municipal-layer-discovery.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Discover authoritative layer IDs before bounded public address queries
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.parse,urllib.request,zipfile
          O=pathlib.Path('municipal-layer-evidence');O.mkdir()
          B=[-83.175,42.680,-83.120,42.726]
          BASE='https://atlas.rochesterhills.org/arcgis/rest/services/'
          SERVICES=['MasterAddressPoints/MapServer','Addresses/MasterAddresses_PublicDataset/MapServer','FacilitiesStructures/Building/MapServer','RochesterHillsAddress/MapServer','RochesterHillsAddressLite/MapServer','RochesterAddress/MapServer','OaklandAddressLabels/MapServer']
          def save(p,b):
            if not isinstance(b,bytes):b=json.dumps(b,indent=2).encode()
            p.write_bytes(b);return hashlib.sha256(b).hexdigest()
          def req(u,p):
            url=u+'?'+urllib.parse.urlencode(p)
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Public municipal address verification'}),timeout=65) as r:b=r.read(24000001)
            if len(b)>24000000:raise ValueError('size bound')
            j=json.loads(b)
            if 'error' in j:raise ValueError(str(j['error']))
            return j,b,url
          def service(s):
            u=BASE+s;d=O/s.replace('/','-');d.mkdir();rs=[]
            try:
              m,b,_=req(u,{'f':'json'});save(d/'service.json',b)
              for layer in m.get('layers',[]):
                if layer.get('subLayerIds'):continue
                lu=u+'/'+str(layer['id']);ld=d/str(layer['id']);ld.mkdir();r={'source':lu,'layer_name':layer['name'],'bbox':B,'complete':False,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pages':[]}
                try:
                  lm,b,_=req(lu,{'f':'json'});save(ld/'metadata.json',b)
                  if lm.get('geometryType') not in ['esriGeometryPoint','esriGeometryPolygon']:
                    r['disposition']='non-address point/polygon layer';rs.append(r);save(ld/'receipt.json',r);continue
                  oid=lm.get('objectIdField') or next(x['name'] for x in lm['fields'] if x['type']=='esriFieldTypeOID')
                  fields=[x['name'] for x in lm['fields'] if x['name']==oid or (not any(z in x['name'].lower() for z in ['owner','taxpayer','name1','name2','phone','email','assessed','taxable']) and any(z in x['name'].lower() for z in ['address','street','house','building','unit','parcel','keypin','shape','latitude','longitude','type','source','date','status','site','textstring','element'] ))]
                  q={'f':'json','where':'1=1','geometry':','.join(map(str,B)),'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
                  co,b,_=req(lu+'/query',{**q,'returnCountOnly':'true'});save(ld/'count.json',b)
                  idsj,b,_=req(lu+'/query',{**q,'returnIdsOnly':'true'});save(ld/'ids.json',b);ids=sorted(idsj.get('objectIds') or [])
                  if len(ids)!=co['count'] or len(ids)!=len(set(ids)) or len(ids)>18000:raise ValueError('count/ID bound mismatch')
                  fs=[]
                  for k in range(0,len(ids),500):
                    chosen=ids[k:k+500];j,b,url=req(lu+'/query',{'f':'json','objectIds':','.join(map(str,chosen)),'outFields':','.join(fields),'returnGeometry':'true','outSR':4326})
                    if sorted(f['attributes'][oid] for f in j.get('features',[]))!=chosen or j.get('exceededTransferLimit'):raise ValueError('incomplete page')
                    r['pages'].append({'url':url,'count':len(chosen),'sha256':save(ld/f'page-{k//500:03}.json',b)});fs+=j['features']
                  save(ld/'features.json',{'source':lu,'bbox':B,'spatialReference':{'wkid':4326},'features':fs});r.update(complete=True,expected_count=len(ids),returned_count=len(fs))
                except Exception as e:r['error']=str(e)
                save(ld/'receipt.json',r);rs.append(r);print(lu,r.get('complete'),r.get('returned_count'),r.get('error'),flush=True)
            except Exception as e:rs.append({'source':u,'complete':False,'error':str(e)})
            save(d/'receipts.json',rs);return rs
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:results=list(ex.map(service,SERVICES))
          save(O/'receipts.json',[r for rs in results for r in rs])
          with zipfile.ZipFile('municipal-layer-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in O.rglob('*'):
              if p.is_file():z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-municipal-layer-evidence
          path: municipal-layer-evidence.zip
          retention-days: 3
          if-no-files-found: error
