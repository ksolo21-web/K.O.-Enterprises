name: Territory encrypted candidate jobs
'on':
  push:
    branches: [territory-card-production]
    paths: ['territory/transport/requests/**']
permissions:
  contents: read
concurrency:
  group: territory-sealed-candidate-worker
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.actor == 'ksolo21-web' && github.ref == 'refs/heads/territory-card-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OLLAMA_NO_CLOUD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Identify one owner-requested encrypted session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          c=json.loads(subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+os.environ['GITHUB_SHA']],check=True,capture_output=True,text=True).stdout)
          if c.get('author',{}).get('login')!='ksolo21-web':raise SystemExit('Only an owner-created request may start a session.')
          names=[f['filename'] for f in c['files'] if f['status']=='added' and re.fullmatch(r'territory/transport/requests/[0-9a-f]{32}',f['filename'])]
          if len(names)!=1:raise SystemExit('Exactly one new encrypted session request is required.')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TERRITORY_SESSION='+names[0].rsplit('/',1)[1]+'\n')
          PY
      - name: Install exact dependencies without cache
        run: |
          python3 -m venv "$RUNNER_TEMP/territory-env"
          "$RUNNER_TEMP/territory-env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r territory/production/requirements.txt
      - name: Require original source integrity and software tests
        run: |
          "$RUNNER_TEMP/territory-env/bin/python" territory/production/audit_kit.py
          (cd territory/production && "$RUNNER_TEMP/territory-env/bin/python" -m unittest -q test_delivery)
      - name: Process encrypted input and publish encrypted candidates only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/territory-env/bin/python" territory/production/worker.py "$TERRITORY_SESSION"
      - name: Prepare only the encrypted return envelope for authenticated download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/territory-env/bin/python" territory/production/delivery.py "$TERRITORY_SESSION" "$RUNNER_TEMP/territory-encrypted-download/result.encrypted.json"
      - name: Retain encrypted return envelope for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: territory-encrypted-${{ env.TERRITORY_SESSION }}
          path: ${{ runner.temp }}/territory-encrypted-download/result.encrypted.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
