# One-time trial authorized by the owner; no cron, no PR triggers, no deployment.
name: Home Inspection - One-Time Synthetic Vision Proof (Retry A03)
on:
  push:
    branches: [home-inspection-development]
    paths:
      - ventures/home-inspection/docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-30_A03.md
permissions:
  contents: read
concurrency:
  group: home-inspection-approved-synthetic-20261030-a03
  cancel-in-progress: false
jobs:
  one-time-vision-proof:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ksolo21-web/K.O.-Enterprises' &&
      github.ref == 'refs/heads/home-inspection-development' &&
      github.event.head_commit.message == 'trial(home-inspection): OWNER_APPROVED_SYNTHETIC_CPU_RUN_20261030_A03'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        working-directory: ventures/home-inspection
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_KEEP_ALIVE: '0'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact authorized development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify narrow owner approval; keep company autonomy paused
        shell: bash
        run: |
          set -euo pipefail
          test -f ../../PAUSE_AUTONOMY
          test -f docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-30_A03.md
          grep -Fxq 'Authorization-ID: OWNER_APPROVED_SYNTHETIC_CPU_RUN_20261030_A03' docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-30_A03.md
          grep -Fxq 'Authorization-Scope: one synthetic-only GitHub-hosted CPU vision trial, no customers, no secrets, no deployment' docs/ONE_TIME_SYNTHETIC_TRIAL_APPROVAL_2026-10-30_A03.md
          test "$GITHUB_REF" = 'refs/heads/home-inspection-development'
          test "$GITHUB_REPOSITORY" = 'ksolo21-web/K.O.-Enterprises'
          ! test -d private_case && ! test -d customer_data && ! test -d client_data
          echo 'Explicit one-time synthetic exception verified. All other external actions stay paused.'
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg and zstd before any media processing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for binary in ffmpeg zstd; do
            if ! command -v "$binary" >/dev/null 2>&1; then missing+=("$binary"); fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          command -v ffmpeg
          command -v zstd
          ffmpeg -version | head -n 1
          zstd --version
          tar --help | grep -q -- --zstd
      - name: Generate synthetic fixtures and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          command -v ffmpeg
          command -v zstd
          python -m scripts.generate_public_fixtures
          python -m unittest discover -s tests -q
      - name: Download and verify pinned Ollama binary
        shell: bash
        run: |
          set -euo pipefail
          free_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
          if (( free_kib < 9 * 1024 * 1024 )); then
            echo 'BLOCKED: less than 9 GiB free disk' >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          install_dir="$RUNNER_TEMP/ollama-pinned"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst \
            --output "$archive"
          python -m scripts.verify_pinned_ollama "$archive"
          tar --zstd -xf "$archive" -C "$install_dir"
          rm -- "$archive"
          test -x "$install_dir/bin/ollama"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          export PATH="$install_dir/bin:$PATH"
          ollama --version
          mkdir -p "$RUNNER_TEMP/home-inspection-models"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/home-inspection-models" >> "$GITHUB_ENV"
      - name: Start local CPU vision runtime and obtain public weights
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5vl:3b
          ollama pull granite3.2-vision:2b
      - name: Prove both models generate actual image-conditioned responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-results/github-actions-one-time
          python - <<'PY'
          from inspection_engine.local_runtime import local_json, preflight_models
          from inspection_engine.model_smoke import synthetic_probe_image
          import base64, hashlib, json, pathlib, time
          root = pathlib.Path('local-results/github-actions-one-time')
          models = ['qwen2.5vl:3b', 'granite3.2-vision:2b']
          info = preflight_models(*models)
          evidence = {'schema':1, 'scope':'SYNTHETIC_ONLY', 'real_ollama_requests':[],
                      'models_advertised_vision':info['preflight'], 'customer_release_allowed':False}
          out = root/'first_real_vision_proofs.json'
          for role, name, color, shape in [('writer',models[0],'red','square'),
                                           ('reviewer',models[1],'blue','circle')]:
              img = synthetic_probe_image(color=color, shape=shape)
              payload = {'model':name, 'prompt':'What color and shape is the one large solid object? Answer briefly.',
                         'images':[base64.b64encode(img).decode('ascii')],
                         'stream':False, 'options':{'temperature':0,'num_predict':64}, 'keep_alive':0}
              try:
                  started=time.monotonic()
                  response=local_json('POST','/api/generate',payload,timeout=180,max_bytes=20000)
                  proof={'role':role, 'model':name, 'image_sha256':hashlib.sha256(img).hexdigest(),
                         'response':response.get('response','')[:1000], 'done':response.get('done',False),
                         'elapsed_seconds':round(time.monotonic()-started,2)}
                  evidence['real_ollama_requests'].append(proof)
                  out.write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
                  print('REAL_OLLAMA_EVIDENCE', json.dumps(proof), flush=True)
                  if not proof['done']: raise RuntimeError('Inference not completed')
              except Exception as exc:
                  evidence['blocker']=str(exc)
                  out.write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
                  raise
          PY
      - name: Real synthetic vision, agent zoom, video still and Q02 review
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_vision_acceptance \
            --writer-model qwen2.5vl:3b \
            --review-model granite3.2-vision:2b \
            --out-dir local-results/github-actions-one-time/acceptance
      - name: Preserve only noncustomer synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa03 # v4.6.2
        with:
          name: one-time-home-inspection-synthetic-vision-proof-a03
          path: ventures/home-inspection/local-results/github-actions-one-time/
          if-no-files-found: ignore
          retention-days: 3
