name: Streamwood public 2025 imagery verification
'on':
  push:
    branches: [territory-255-260-geography-20260911]
    paths: ['.github/workflows/public-streamwood-imagery-20260920.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read bounded county imagery and public clubhouse reference
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,datetime,zipfile
          out=pathlib.Path('public-2025-imagery');out.mkdir()
          recs=[]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Bounded public GIS verification'})
            with urllib.request.urlopen(req,timeout=55) as r:b=r.read(20000001)
            if len(b)>20000000:raise ValueError('Bounded size exceeded')
            return b
          url='https://gisservices.oakgov.com/arcgis/rest/services/ImageServices/EnterpriseOrthoTC2025ImageService/ImageServer'
          try:
            b=get(url+'?f=json');(out/'metadata.json').write_bytes(b)
            meta=json.loads(b)
            if 'error'in meta:raise ValueError(str(meta['error']))
            params={'bbox':'-9258841.162,5259006.351,-9258440.703,5259421.942','bboxSR':3857,'imageSR':3857,'size':'2200,2283','format':'png','pixelType':'U8','bandIds':'0,1,2','interpolation':'RSP_BilinearInterpolation','f':'json'}
            q=url+'/exportImage?'+urllib.parse.urlencode(params)
            b=get(q);(out/'export-response.json').write_bytes(b);j=json.loads(b)
            if 'error'in j:raise ValueError(str(j['error']))
            image=get(j['href']);assert image.startswith(b'\x89PNG'),'Not PNG'
            (out/'county-2025.png').write_bytes(image)
            recs.append({'source':q,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'imagery_vintage':2025,'complete':True,'bytes':len(image),'sha256':hashlib.sha256(image).hexdigest(),'extent':j.get('extent')})
          except Exception as e:recs.append({'source':url,'complete':False,'error':str(e)})
          for name,url in [('clubhouse.pdf','https://highlandergroup.net/wp-content/uploads/2024/01/Streamwood-Estates-Clubhouse-Rental-Information-December-2023.pdf'),('address-point.html','https://www.waze.com/live-map/directions/united-states/michigan/rochester-hills/1900-streamwood-dr?to=place.ChIJ5y312PvBJIgRKs9Laa5KJC0')]:
            try:
              b=get(url);(out/name).write_bytes(b);recs.append({'source':url,'complete':True,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()})
            except Exception as e:recs.append({'source':url,'complete':False,'error':str(e)})
          (out/'receipt.json').write_text(json.dumps(recs,indent=2))
          print(json.dumps(recs,indent=2))
          with zipfile.ZipFile('public-2025-imagery.zip','w',zipfile.ZIP_DEFLATED)as z:
            for p in sorted(out.iterdir()):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streamwood-public-2025-imagery
          path: public-2025-imagery.zip
          retention-days: 2
          if-no-files-found: error
