name: Transfer retained public geographic references
on:
  push:
    branches: [public-geography-reference-20260907]
    paths: ['.github/workflows/public-geography.yml']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained reference archive is present
        run: |
          test -s public-data/rochester-public-geography.zip
          sha256sum public-data/rochester-public-geography.zip
          python -c "import zipfile; z=zipfile.ZipFile('public-data/rochester-public-geography.zip'); assert z.testzip() is None; print(len(z.namelist()), 'verified members')"
      - uses: actions/upload-artifact@v4
        with:
          name: territory-public-geography-full
          path: |
            public-data/rochester-public-geography.zip
            public-data/manifest.json
            public-data/retrieval-summary.json
          retention-days: 2
