name: Public map reference supplement
on:
  push:
    branches: [public-geography-reference-20260907]
    paths: ['retrieve_public_supplement.py', '.github/workflows/public-geography.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python retrieve_public_supplement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-reference-supplement
          path: public-supplement.zip
          retention-days: 1
