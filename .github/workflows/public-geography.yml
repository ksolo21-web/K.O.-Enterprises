name: Public geography reference export
on:
  push:
    branches: [public-geography-reference-20260907]
    paths: ['.github/workflows/public-geography.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Make a compact text road reference as a transfer fallback
        run: |
          python - <<'PY'
          import json,zipfile,pathlib,zlib,base64,hashlib
          p=pathlib.Path('public-data')
          with zipfile.ZipFile(p/'rochester-public-geography.zip') as z:
            d=json.loads(z.read('county-roads/features.json'))
          names=[];rows=[]
          def encode(points):
            result='';prev=[0,0]
            for pt in points:
              for j in range(2):
                val=round(pt[j]*1000000);v=val-prev[j];prev[j]=val;v=~(v<<1) if v<0 else v<<1
                while v>=32:result+=chr((32|(v&31))+63);v>>=5
                result+=chr(v+63)
            return result
          for f in d['features']:
            a=f['attributes'];name=a.get('CartographicName') or ' '.join(str(a.get(k) or '') for k in ['DirectionalPrefix','StreetName','StreetType','DirectionalSuffix']).strip()
            if name not in names:names.append(name)
            rows.append([a['OBJECTID'],names.index(name),[encode(x) for x in f['geometry']['paths']]])
          raw=json.dumps({'precision':1000000,'names':names,'roads':rows},separators=(',',':')).encode();b64=base64.b64encode(zlib.compress(raw,9)).decode()
          (p/'road-compact-info.json').write_text(json.dumps({'raw_bytes':len(raw),'encoded_chars':len(b64),'raw_sha256':hashlib.sha256(raw).hexdigest(),'note':'Rounded public reference derivative only; original full-precision source remains in ZIP.'},indent=2))
          for i in range(0,len(b64),8000):(p/('road-text-%03d.txt'%(i//8000))).write_text(b64[i:i+8000])
          print((p/'road-compact-info.json').read_text())
          PY
          git config user.name 'Public geography snapshot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data
          git diff --cached --quiet || git commit -m 'Retain compact public-road reference for analysis'
          git push origin HEAD:public-geography-reference-20260907
      - uses: actions/upload-artifact@v4
        with:
          name: rochester-public-geography
          path: public-data/rochester-public-geography.zip
          retention-days: 1
