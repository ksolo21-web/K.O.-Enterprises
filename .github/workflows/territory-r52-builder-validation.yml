name: Territory R52 builder authority validation
'on':
  push:
    branches:
      - territory-r52-builder-repair-20260918
      - territory-card-production
    paths:
      - 'territory/production/r52/**'
      - 'territory/production/r52_policy.py'
      - 'territory/production/engine.py'
      - 'territory/production/repair.py'
      - 'territory/production/fixer_advisor.py'
      - 'territory/production/enforcer_critic.py'
      - 'territory/production/real_card_review.py'
      - 'territory/production/visual_review.py'
      - 'territory/production/batch.py'
      - 'territory/production/roles/**'
      - 'territory/production/test_r52_authority_chain.py'
      - 'territory/production/test_visual_card_review.py'
      - 'territory/production/test_real_card_review.py'
      - 'territory/production/test_repair.py'
      - 'territory/production/test_runtime_integration.py'
      - '.github/workflows/territory-r52-builder-validation.yml'
permissions:
  contents: read
concurrency:
  group: territory-r52-builder-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ksolo21-web/K.O.-Enterprises' && github.actor == 'ksolo21-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned territory dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/r52env"
          "$RUNNER_TEMP/r52env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r territory/production/requirements.txt
      - name: Verify legacy source capsule remains intact
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd territory/production
          "$RUNNER_TEMP/r52env/bin/python" - <<'PY'
          import json
          from pathlib import Path
          import verify_originals
          result=verify_originals.verify_installed(Path('.').resolve())
          print(json.dumps(result,indent=2))
          assert result['installed_originals_verified']==138
          PY
      - name: Verify exact R52 activation layer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd territory/production
          "$RUNNER_TEMP/r52env/bin/python" r52_policy.py
      - name: Compile changed runtime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/r52env/bin/python" -m py_compile \
            territory/production/r52_policy.py \
            territory/production/engine.py \
            territory/production/repair.py \
            territory/production/fixer_advisor.py \
            territory/production/enforcer_critic.py \
            territory/production/real_card_review.py \
            territory/production/visual_review.py \
            territory/production/batch.py \
            territory/production/test_r52_authority_chain.py
      - name: Run R52 authority-chain regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd territory/production
          "$RUNNER_TEMP/r52env/bin/python" -m unittest -v test_r52_authority_chain
      - name: Run inherited critic/controller regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd territory/production
          "$RUNNER_TEMP/r52env/bin/python" -m unittest -v \
            test_engine \
            test_visual_card_review \
            test_real_card_review
      - name: Run production baseline audit suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd territory/production
          set +e
          "$RUNNER_TEMP/r52env/bin/python" audit_kit.py
          status=$?
          cat evidence/continuation-kit-audit.txt
          exit $status
      - name: Assert role docs exist
        run: |
          test -s territory/production/roles/ROLE-AUTHORITY-CONTRACT.md
          test -s territory/production/roles/FIXER-ADVISOR-SKILL.md
          test -s territory/production/roles/ENFORCER-CRITIC-SKILL.md
      - name: Record scope
        if: always()
        run: |
          {
            echo 'R52 software/policy validation only.'
            echo 'No real territory card is approved by this workflow.'
            echo 'Release still requires exact-card source evidence, critic evidence, and Enforcer approval.'
          } >> "$GITHUB_STEP_SUMMARY"
