name: Compact public neighborhood references
on:
  push:
    branches: [public-geography-reference-20260907]
    paths: ['build_public_neighborhoods.py', '.github/workflows/public-neighborhoods.yml']
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install shapely
      - run: python build_public_neighborhoods.py
      - name: Save public reference derivatives
        if: always()
        run: |
          git config user.name 'Public geographic reference'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-neighborhoods
          git diff --cached --quiet || git commit -m 'Public neighborhood road inventories from counted snapshot'
          git push origin HEAD:public-geography-reference-20260907
