name: Territory v2 - blind local critic calibration
on:
  push:
    branches: [territory-card-production]
    paths:
      - 'territory/production/runtime/neural.py'
      - 'territory/production/runtime/calibrate.py'
      - '.github/workflows/territory-v2-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: territory-v2-calibration
  cancel-in-progress: true
jobs:
  local-critic:
    if: ${{ github.repository == 'ksolo21-web/K.O.-Enterprises' && github.event.repository.private == false && github.ref == 'refs/heads/territory-card-production' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      COMPANY_OS_PAUSED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install fixed synthetic-test dependencies without caches
        run: python -m pip install Pillow==12.3.0 jsonschema==4.26.0
      - name: Fetch hash-pinned local runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/ollama.tgz" https://github.com/ollama/ollama/releases/download/v0.11.10/ollama-linux-amd64.tgz
          echo "da2be71e972752e3099ef1d1226050d2b3d1ce79a4fec3bdb6edc70a7601e060  $RUNNER_TEMP/ollama.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tgz"
      - name: Run actual blind development and held-out image reviews
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && break || sleep 1
          done
          timeout 480 ollama pull qwen2.5vl:7b > "$RUNNER_TEMP/model-pull.log" 2>&1 || { tail -c 2000 "$RUNNER_TEMP/model-pull.log"; exit 1; }
          timeout 1800 python territory/production/runtime/calibrate.py --out "$RUNNER_TEMP/calibration-v2.json"
      - name: Preserve public synthetic evidence on this branch, never as metered artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/calibration-v2.json" || { echo 'No complete inference receipt was produced.' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          gh api --method PUT "repos/ksolo21-web/K.O.-Enterprises/contents/territory/production/evidence/calibration-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" -f message='Retain actual synthetic critic calibration evidence' -f branch='territory-card-production' -f content="$(base64 -w0 "$RUNNER_TEMP/calibration-v2.json")" > "$RUNNER_TEMP/publication.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/calibration-v2.json")); print(str(p["passed"])+"/"+str(p["required"])+" synthetic cases passed. This is not real-card qualification or approval.")' >> "$GITHUB_STEP_SUMMARY"
