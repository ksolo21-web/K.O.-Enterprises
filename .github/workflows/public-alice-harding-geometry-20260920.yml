name: Alice Harding bounded public map geometry
'on':
  push:
    branches: [territory-255-260-geography-20260911]
    paths: ['.github/workflows/public-alice-harding-geometry-20260920.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve bounded public geometry without owner or resident information
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,datetime,hashlib,zipfile,concurrent.futures
          out=pathlib.Path('public-alice-harding');out.mkdir()
          bbox='-83.1544,42.6713,-83.1408,42.6823'
          base='https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/'
          sources={
            'roads':base+'EnterpriseTransportationDataMapService/MapServer/0',
            'addresses':base+'EnterpriseOpenParcelDataMapService/MapServer/0',
            'parcels':base+'EnterpriseOpenParcelDataMapService/MapServer/1',
            'landuse':base+'EnterpriseOpenPlanningMapService/MapServer/4',
            'county_buildings':'https://gisservices.oakgov.com/arcgisds/rest/services/Hosted/Building_Outline/FeatureServer/30',
            'semcog_buildings':'https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints/FeatureServer/14',
            'building_points':'https://gis.semcog.org/server/rest/services/Hosted/Building_Points/FeatureServer/34'
          }
          allowed=set('objectid objectid_12 pin keypin type streetname streettype directionalprefix directionalsuffix cartographicname act51roadtype jurisdictionname nfc revisiondate traveldirection siteprefixone sitestreetnumber sitestreetname sitestreettype sitesuffixone sitestreetaddress sitecity sitestate sitezipcode cvttaxdescription classcode siteaddress structure_desc landusecode landuse landuse_code landuse_type lu_code lu_description bldg_id building_id address year source date height use parcel_id build_type city_id apn year_built demolished housing_units stories loadd1 hiadd1 street1 loadd2 hiadd2 street2 zipcode aka condo_id'.split())
          def get(url,p=None):
            u=url+('?' + urllib.parse.urlencode(p) if p else '')
            with urllib.request.urlopen(u,timeout=35) as r:b=r.read(25000001)
            assert len(b)<25000000
            j=json.loads(b)
            if 'error' in j:raise RuntimeError(str(j['error']))
            return j,b,u
          def retrieve(item):
            name,url=item;f=out/name;f.mkdir();rec={'id':name,'source':url,'bounds':bbox,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'complete':False,'pages':[]}
            try:
              m,b,u=get(url,{'f':'json'});(f/'metadata.json').write_bytes(b)
              oid=m.get('objectIdField') or next(x['name'] for x in m['fields'] if x['type']=='esriFieldTypeOID')
              fields=[x['name'] for x in m['fields'] if x['name'].lower() in allowed]
              if oid not in fields:fields.insert(0,oid)
              q={'f':'json','where':'1=1','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              j,b,u=get(url+'/query',{**q,'returnIdsOnly':'true'});(f/'ids.json').write_bytes(b);ids=sorted(j.get('objectIds') or [])
              j,b,u=get(url+'/query',{**q,'returnCountOnly':'true'});(f/'count.json').write_bytes(b)
              assert j['count']==len(ids)==len(set(ids)) and len(ids)<8000
              features=[]
              for offset in range(0,len(ids),150):
                batch=ids[offset:offset+150];j,b,u=get(url+'/query',{'f':'json','objectIds':','.join(map(str,batch)),'outFields':','.join(fields),'returnGeometry':'true','outSR':4326})
                assert sorted(x['attributes'][oid] for x in j['features'])==batch and not j.get('exceededTransferLimit',False)
                (f/f'page-{offset//150}.json').write_bytes(b);features.extend(j['features']);rec['pages'].append({'url':u,'count':len(batch),'ids':batch,'sha256':hashlib.sha256(b).hexdigest(),'exceededTransferLimit':False})
              (f/'features.json').write_text(json.dumps({'source':url,'spatialReference':{'wkid':4326},'features':features},separators=(',',':')))
              rec.update(complete=True,count=len(features),object_id_field=oid,fields=fields,editing_info=m.get('editingInfo'));print(name,'COMPLETE',len(features),flush=True)
            except Exception as e:rec['error']=str(e);print(name,'ERROR',str(e),flush=True)
            return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:recs=list(ex.map(retrieve,sources.items()))
          for label,url in [('county_services','https://gisservices.oakgov.com/arcgis/rest/services'),('county_images','https://gisservices.oakgov.com/arcgis/rest/services/Imagery'),('semcog_services','https://gis.semcog.org/server/rest/services/Hosted')]:
            try:
              j,b,u=get(url,{'f':'json'});(out/(label+'.json')).write_bytes(b)
            except Exception as e:recs.append({'id':label,'complete':False,'error':str(e)})
          (out/'receipts.json').write_text(json.dumps(recs,indent=2))
          with zipfile.ZipFile('public-alice-harding.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(out.rglob('*')):
              if p.is_file():z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-alice-harding-20260920
          path: public-alice-harding.zip
          retention-days: 2
          if-no-files-found: error
